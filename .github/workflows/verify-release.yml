name: Verify published version
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check tag points to matching integration manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          tag = os.environ['TAG']
          manifest = json.loads(Path('custom_components/vn_weather_ha/manifest.json').read_text())
          assert tag == 'v' + manifest['version'], 'Release tag differs from manifest: publish via Actions workflow instead'
          print('Release manifest verified:', tag)
          PY
