name: Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests and syntax
        run: |
          python -m pip install pytest
          python -m compileall -q custom_components/vn_weather_ha
          python -m pytest -q tests
          node --check custom_components/vn_weather_ha/frontend/vn-weather-ha-card.js
          node tests/test_card_node.js
      - name: Validate packages
        run: |
          python scripts/package.py
          python -m json.tool custom_components/vn_weather_ha/manifest.json > /dev/null
          python -m json.tool hacs.json > /dev/null
